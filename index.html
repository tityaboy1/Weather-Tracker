<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <script type="text/javascript" src="theme.js" defer></script>
    <title>TamDan Weather</title>
  </head>
  <body >
    <header>

      <a class="brand" href="index.html">
        <img src="logo.png" alt="" />
        <h1 class="logo-name">TamDan Weather</h1>
      </a>

    <select id="languageSelect">
        <option value="en">English</option>
        <option value="kh">ខ្មែរ</option>
    </select>

      <button
        id="theme-toggle"
        type="button"
        aria-label="Switch to dark mode">
        <span class="material-symbols-outlined" >dark_mode</span>
        <span class="material-symbols-outlined" >sunny</span>
      </button>

    </header>
    <main>

      <h1 data-i18n="h1">Check the weather in your local or anywhere</h1>

      <form>
        <input type="text" id="cityinput" placeholder="Enter city..." data-i18n="placeholder" required />
        <button id="btn" type="submit" data-i18n="Search">Search</button>
      </form>
      <p id="message" role="status" data-i18n="message">Please enter the city you want to search!</p>
      <!-- Card for weather in formation -->
      <div class="card" hidden>
        <div class="temp">
          <span class="material-symbols-outlined"> location_on </span>
          <h3 id="city"></h3>
          <h1 id="temp"></h1>
        </div>
        <div class="humidity">
          <span class="material-symbols-outlined"> humidity_percentage </span>
          <h3 data-i18n="humidity">humidity</h3>
          <p id="humidity"></p>
        </div>
        <div class="wind">
          <span class="material-symbols-outlined"> air </span>
          <h3 data-i18n="wind">wind</h3>
          <p id="wind"></p>
        </div>
        <div class="visibility">
          <span class="material-symbols-outlined"> visibility </span>
          <h3 data-i18n="visibility">visibility</h3>
          <p id="visibility"></p>
        </div>
        <div class="pressure">
          <span class="material-symbols-outlined"> speed </span>
          <h3 data-i18n="pressure">pressure</h3>
          <p id="pressure"></p>
        </div>
        <div class="cloud">
          <img  class="material-symbols-outlined" id="weather-icon"> </img>
          <h3 id="condition"></h3>
        </div>
      </div>
    </main>

    <script src="main.js"></script>
    <script src="language.js"></script>
  </body>
</html>
